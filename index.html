<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<title>Quel pays te correspond ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --ink:#13233A; --muted:#5B6B7F; --line:#D5DDE5;
  color-scheme:light;
  --accent:#0F7F82; --accent-soft:#D6EEEE; --want:#D39A00; --bad:#B8403A; --good:#1E8A52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --surface:#172233; --ink:#E6ECF2; --muted:#93A3B6; --line:#2A3A50;
    color-scheme:dark;
    --accent:#3CC2C4; --accent-soft:#163A44; --want:#F0B82C; --bad:#E0716A; --good:#5BC98C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#172233; --ink:#E6ECF2; --muted:#93A3B6; --line:#2A3A50;
  color-scheme:dark;
    --accent:#3CC2C4; --accent-soft:#163A44; --want:#F0B82C; --bad:#E0716A; --good:#5BC98C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1,h2,.display{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif}
h1{font-size:2rem;line-height:1.1;font-weight:800;margin:8px 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
/* Quiz */
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtheme{color:var(--accent);font-weight:600;font-size:.9rem;margin:0}
.qtext{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;line-height:1.25;font-weight:700;margin:4px 0 16px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:13px 15px;margin-bottom:10px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.nav{display:flex;justify-content:space-between;margin-top:8px}
.link{background:none;border:0;color:var(--muted);padding:8px 0;text-decoration:underline}
/* Results */
.who{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.who h2{margin:0;font-size:1.5rem}
.badge{font-size:.8rem;color:var(--want);border:1px solid var(--want);border-radius:999px;padding:2px 10px;white-space:nowrap}
.ranking{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:10px 0 4px}
.rank{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:left;min-width:108px}
.rank b{display:block;font-size:.95rem}
.rank span{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent)}
.rank[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hex{display:block;width:100%;height:auto;max-width:420px;margin:0 auto}
.legend{display:flex;gap:16px;justify-content:center;font-size:.85rem;color:var(--muted);margin:4px 0 14px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.score{text-align:center;margin:0 0 6px}
.score .display{font-size:3rem;font-weight:800;line-height:1;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:420px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:1rem;margin:0 0 6px}
.cols ul{margin:0;padding-left:18px;font-size:.92rem}
.cols li{margin-bottom:4px}
.good h3{color:var(--good)} .weak h3{color:var(--bad)}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.cta{display:block;width:100%;margin-top:18px;border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.field input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:.88rem;margin:6px 0 0;min-height:1.2em}
.saved{margin-top:22px}
.saved h2{font-size:1.15rem;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.row .info{flex:1;min-width:0}
.row .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .info small{color:var(--muted)}
.btn{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;font-size:.88rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .cta{margin-top:0}
.cta.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
/* Responsive */
.wrap{max-width:1120px;padding:clamp(16px,3vw,40px) clamp(16px,4vw,48px) 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:clamp(1.8rem,4vw,2.8rem)}
.lead{max-width:62ch}
.panel{padding:clamp(18px,3vw,32px)}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.theme button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:.85rem;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quiz{max-width:860px;margin:0 auto}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts .opt{margin-bottom:0;height:100%}
.result{display:grid;gap:18px;grid-template-areas:"filters" "viz" "details"}
.filters{grid-area:filters;min-width:0}
.viz{grid-area:viz;min-width:0}
.details{grid-area:details;min-width:0}
.details .cols{margin-top:0}
@media (min-width:760px){
  .opts{grid-template-columns:repeat(3,1fr)}
  .qtext{font-size:1.75rem}
}
@media (min-width:860px){
  .home:has(.saved){display:grid;grid-template-columns:1fr 1fr;column-gap:48px;align-items:start}
  .home .saved{margin-top:0}
}
@media (min-width:960px){
  .result{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"viz filters" "viz details";column-gap:48px;align-items:start}
  .ranking{flex-wrap:wrap;overflow:visible}
  .viz{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .hex{max-width:540px}
  .score .display{font-size:3.6rem}
}
.analysis{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.analysis h3{font-size:1rem;margin:0 0 6px}
.analysis p{margin:0 0 10px;font-size:.95rem}
.axisrank,.full{list-style:none;margin:0;padding:0}
.axisrank li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.axisrank b{white-space:nowrap}
.more{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.more summary{cursor:pointer;font-weight:600}
.more ul{padding-left:18px;font-size:.9rem}
.more p{font-size:.9rem}
.full{max-height:340px;overflow-y:auto;margin-top:10px;counter-reset:r}
.full li{counter-increment:r}
.fullrow{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:transparent;padding:6px 4px;border-radius:8px;text-align:left}
.fullrow::before{content:counter(r);color:var(--muted);min-width:2.2em;font-size:.85rem}
.fullrow span{flex:1}
.fullrow[aria-pressed="true"]{background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ====== Stockage local ====== */
const KEY = 'qcm-pays:v1';
function loadStore(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.profiles) return d; }catch(e){}
  return {profiles:{}, last:null};
}
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
let store = loadStore();

/* ====== Thème ====== */
function applyTheme(t){
  const root = document.documentElement;
  if(t==='light'||t==='dark') root.dataset.theme = t; else { delete root.dataset.theme; t='auto'; }
  try{ localStorage.setItem('qcm-pays:theme', t); }catch(e){}
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.themeSet===t));
}
applyTheme(document.documentElement.dataset.theme || 'auto');

/* ====== État ====== */
const app = document.getElementById('app');
let current = store.last && store.profiles[store.last] ? store.last : null;
let view = current ? 'result' : 'home';
let qi = 0, draft = [], selected = 0, region = 'Tous', draftName = '';

const esc = t => String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } };

/* ====== Calcul ====== */
function needs(answers){
  return AXES.map(a=>{
    let sr=0, sw=0, n=0;
    QUESTIONS.forEach((q,i)=>{ if(q.axis!==a.id) return; const x=answers[i]; if(x==null) return;
      const o=q.opts[x]; n++; sw+=o.w; sr+=o.req*o.w; });
    if(!n) return null;
    return { req: sw ? Math.round(sr/sw*10)/10 : 0, w: sw/n };
  });
}
const num = v => String(v).replace('.', ',');
function score(c, nd){
  let pen=0, den=0;
  nd.forEach((o,i)=>{ if(!o||!o.w) return; den += o.w*o.req; pen += o.w*Math.max(0,o.req-c.v[i]); });
  return den ? Math.round(100 - pen/den*100) : 0;
}
function ranked(answers, reg){
  const nd = needs(answers);
  return COUNTRIES.filter(c=>reg==='Tous'||c.r===reg).map(c=>({...c, s:score(c,nd)})).sort((a,b)=>b.s-a.s);
}

/* ====== Hexagone ====== */
function pt(i, val, R=110, cx=170, cy=160){ const ang=-Math.PI/2+i*Math.PI*2/6, r=R*val/10; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; }
function poly(vals){ return vals.map((v,i)=>pt(i,v).join(',')).join(' '); }
function hexSVG(c, nd){
  let g='';
  [2.5,5,7.5,10].forEach(l=> g+=`<polygon points="${poly([l,l,l,l,l,l])}" fill="none" stroke="var(--line)"/>`);
  AXES.forEach((a,i)=>{ const [x,y]=pt(i,10); g+=`<line x1="170" y1="160" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  g+=`<polygon points="${poly(nd.map(o=>o?o.req:0))}" fill="none" stroke="var(--want)" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  g+=`<polygon points="${poly(c.v)}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5"/>`;
  c.v.forEach((v,i)=>{ const [x,y]=pt(i,v); const miss=nd[i]&&nd[i].w&&v<nd[i].req; g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${miss?'var(--bad)':'var(--accent)'}"/>`; });
  AXES.forEach((a,i)=>{ const [x,y]=pt(i,10,138); const an=Math.abs(x-170)<5?'middle':(x>170?'start':'end');
    g+=`<text x="${x}" y="${y+4}" text-anchor="${an}" font-size="15" font-weight="600" fill="${nd[i]?'var(--ink)':'var(--muted)'}">${a.short}${nd[i]?'':' (?)'}</text>`;
    g+=`<text x="${x}" y="${y+21}" text-anchor="${an}" font-size="13" fill="var(--muted)">${c.v[i]}/10</text>`; });
  return `<svg class="hex" viewBox="-70 0 480 335" role="img" aria-label="Hexagone de correspondance ${esc(c.n)}">${g}</svg>`;
}

/* ====== Analyse ====== */
const ord = n => n===1 ? '1er' : n+'e';
function analysisHTML(c, answers, nd, weak, name){
  const all = ranked(answers, 'Tous'), N = all.length;
  const pos = all.findIndex(x=>x.n===c.n)+1;
  let txt = `${c.n} arrive ${ord(pos)} sur ${N} pays pour ${name}. `;
  let alt = null;
  if(weak.length){
    const wi = weak[0].i;
    txt += `Son point le plus faible pour toi : ${AXES[wi].label.toLowerCase()} (${c.v[wi]}/10). `;
    alt = all.filter(x=>x.n!==c.n && x.s>=c.s-8 && x.v[wi]>c.v[wi]).sort((a,b)=>b.v[wi]-a.v[wi]||b.s-a.s)[0];
    if(alt) txt += `Si ce critère pèse lourd, ${alt.n} fait mieux (${alt.v[wi]}/10) pour un score proche (${alt.s} %).`;
  } else txt += 'Il remplit toutes tes exigences.';
  const ranks = AXES.map((a,i)=>{ if(!nd[i]||!nd[i].w) return '';
    const r = 1 + COUNTRIES.filter(x=>x.v[i]>c.v[i]).length;
    return `<li><span>${a.label}</span><b>${ord(r)} sur ${N}</b></li>`; }).join('');
  return `<div class="analysis"><h3>Analyse</h3><p>${txt}</p>${ranks?`<ul class="axisrank">${ranks}</ul>`:''}</div>`;
}
const METHOD = `<p>Chaque note de 0 à 10 est une estimation établie par Claude à partir d’indices publics, tels qu’ils étaient connus mi-2026. Ce ne sont pas les chiffres officiels : ils peuvent être approximatifs ou en retard sur l’actualité, à vérifier avant toute décision.</p>
<ul>
<li><b>Liberté individuelle</b> : Human Freedom Index (volet liberté personnelle, Cato et Fraser Institute) et Freedom House.</li>
<li><b>Liberté d’entreprendre</b> : Economic Freedom of the World (Fraser Institute) et Index of Economic Freedom (Heritage Foundation).</li>
<li><b>Succession</b> : existence et taux des droits de succession en ligne directe (guide mondial d’EY). 10 = aucun droit pour les enfants.</li>
<li><b>Sécurité</b> : Global Peace Index, taux d’homicides de l’ONUDC et conflits en cours.</li>
<li><b>Art de vivre</b> : World Happiness Report, complété par le climat, la gastronomie et la vie sociale. C’est l’axe le plus subjectif.</li>
<li><b>Impôts</b> : taux marginal maximal de l’impôt sur le revenu (tableaux KPMG et PwC). 0 % = 10, 55 % = 1, avec un bonus pour les fiscalités territoriales.</li>
</ul>`;

/* ====== Écrans ====== */
function renderHome(){
  const names = Object.keys(store.profiles).sort((a,b)=>store.profiles[b].date.localeCompare(store.profiles[a].date));
  app.innerHTML = `
  <div class="panel home"><div class="start">
    <div class="field">
      <label for="name">Ton prénom</label>
      <input id="name" autocomplete="given-name" maxlength="40" value="${esc(draftName)}" placeholder="Par exemple Charlie">
      <p class="err" id="err" aria-live="polite"></p>
    </div>
    <button class="cta" data-act="start" style="margin-top:6px">Commencer le QCM</button>
    </div>
    ${names.length ? `<div class="saved"><h2>Profils enregistrés sur cet appareil</h2>
      ${names.map((n,i)=>{ const p=store.profiles[n], top=ranked(p.answers,'Tous')[0];
        return `<div class="row"><div class="info"><b>${esc(n)}</b><small>${top?esc(top.n)+' à '+top.s+'%':''}, le ${fmtDate(p.date)}</small></div>
        <button class="btn primary" data-see="${i}">Voir</button><button class="btn danger" data-del="${i}" aria-label="Supprimer le profil ${esc(n)}">Supprimer</button></div>`; }).join('')}
    </div>` : ''}
  </div>`;
  app._names = names;
  const input = document.getElementById('name');
  input.addEventListener('input', e=>{ draftName = e.target.value; });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') startQuiz(); });
}

function startQuiz(){
  const n = draftName.trim();
  if(!n){ const e=document.getElementById('err'); if(e) e.textContent='Entre ton prénom pour commencer.'; return; }
  current = n; draft = QUESTIONS.map(()=>undefined); qi = 0; view = 'quiz'; render();
}

function renderQuiz(){
  if(qi >= QUESTIONS.length){
    store.profiles[current] = {answers: draft.map(a=>a===undefined?null:a), date: new Date().toISOString()};
    store.last = current; saveStore(); view='result'; selected=0; return render();
  }
  const Q = QUESTIONS[qi], ax = AXES.find(a=>a.id===Q.axis);
  app.innerHTML = `
  <div class="panel quiz">
    <div class="progress"><i style="width:${qi/QUESTIONS.length*100}%"></i></div>
    <p class="qtheme">Question ${qi+1} sur ${QUESTIONS.length} : ${ax.label}</p>
    <p class="qtext">${Q.q}</p>
    <div class="opts">${Q.opts.map((o,i)=>`<button class="opt" data-o="${i}" aria-pressed="${draft[qi]===i}">${o.t}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')}</div>
    <div class="nav">
      <button class="link" data-nav="back">${qi===0?'Annuler':'Question précédente'}</button>
      <button class="link" data-nav="skip">Passer</button>
    </div>
  </div>`;
}

function renderResult(){
  const p = store.profiles[current];
  if(!p){ view='home'; return render(); }
  const answers = QUESTIONS.map((_,i)=>p.answers[i]==null?null:p.answers[i]), partial = answers.some(a=>a==null);
  const list = ranked(answers, region), nd = needs(answers);
  if(selected >= list.length) selected = 0;
  const c = list[selected], good=[], weak=[], unknown=[];
  AXES.forEach((a,i)=>{
    const o = nd[i];
    if(!o){ unknown.push(a.label); return; }
    if(!o.w) return;
    const gap = o.req - c.v[i];
    if(gap<=0) good.push(`${a.label} <small>(${c.v[i]}/10)</small>`);
    else weak.push({t:`${a.label} <small>(${c.v[i]}/10, attendu ${num(o.req)})</small>`, k:gap*o.w, i});
  });
  weak.sort((x,y)=>y.k-x.k);
  const regions = ['Tous', ...new Set(COUNTRIES.map(c=>c.r))];
  const name = esc(current);
  app.innerHTML = `
  <div class="panel">
    <div class="who"><h2>${name}</h2>${partial?'<span class="badge">Réponses partielles</span>':''}</div>
    <div class="result"><div class="filters"><div class="tabs" role="group" aria-label="Région" style="margin:10px 0 0">
      ${regions.map(r=>`<button class="chip" data-region="${r}" aria-pressed="${r===region}">${r}</button>`).join('')}
    </div>
    <div class="ranking">
      ${list.slice(0,6).map((x,i)=>`<button class="rank" data-i="${i}" aria-pressed="${i===selected}"><b>${x.n}</b><span>${x.s}%</span></button>`).join('')}
    </div></div>
    <div class="viz"><p class="score"><span class="display">${c.s}%</span><br><span style="color:var(--muted)">${c.n}</span></p>
    ${hexSVG(c, nd)}
    <div class="legend"><span><i style="background:var(--accent)"></i>${c.n}</span><span><i style="background:var(--want)"></i>Exigences de ${name}</span></div></div>
    <div class="details"><div class="cols">
      <div class="good"><h3>Forces</h3>${good.length?`<ul>${good.map(g=>`<li>${g}</li>`).join('')}</ul>`:'<p class="note">Aucune exigence pleinement remplie.</p>'}</div>
      <div class="weak"><h3>Faiblesses</h3>${weak.length?`<ul>${weak.map(w=>`<li>${w.t}</li>`).join('')}</ul>`:'<p class="note">Rien ne coince.</p>'}</div>
    </div>
    ${unknown.length?`<p class="note">Pas encore renseigné : ${unknown.join(', ')}. Ces critères ne comptent pas dans le score.</p>`:''}
    ${analysisHTML(c, answers, nd, weak, name)}
    <details class="more"><summary>Classement complet (${list.length} pays)</summary>
      <ol class="full">${list.map((x,i)=>`<li><button class="fullrow" data-i="${i}" aria-pressed="${i===selected}"><span>${x.n}</span><b>${x.s} %</b></button></li>`).join('')}</ol>
    </details>
    <details class="more"><summary>Sur quoi reposent les notes ?</summary>${METHOD}</details>
    <p class="note">Enregistré sur cet appareil le ${fmtDate(p.date)}. Le pourcentage mesure à quel point le pays atteint tes exigences, pondérées par leur importance.</p>
    <div class="actions">
      <button class="cta" data-act="redo">Refaire le QCM</button>
      <button class="cta secondary" data-act="home">Autre profil</button>
    </div>
  </div></div></div>`;
}

function render(){
  if(view==='home') renderHome();
  else if(view==='quiz') renderQuiz();
  else renderResult();
  window.scrollTo({top:0});
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.themeSet){ applyTheme(d.themeSet); return; }
  if(d.act==='start') startQuiz();
  else if(d.act==='redo'){ draftName = current; startQuiz(); }
  else if(d.act==='home'){ draftName=''; view='home'; render(); }
  else if(d.see!=null){ current = app._names[+d.see]; store.last=current; saveStore(); selected=0; region='Tous'; view='result'; render(); }
  else if(d.del!=null){ const n = app._names[+d.del];
    if(confirm(`Supprimer le profil de ${n} ?`)){ delete store.profiles[n]; if(store.last===n) store.last=null; saveStore(); render(); } }
  else if(d.o!=null){ draft[qi]=+d.o; qi++; render(); }
  else if(d.nav==='skip'){ draft[qi]=null; qi++; render(); }
  else if(d.nav==='back'){ if(qi===0){ view = store.profiles[current]?'result':'home'; } else qi--; render(); }
  else if(d.i!=null){ selected=+d.i; render(); }
  else if(d.region){ region=d.region; selected=0; render(); }
});
render();
