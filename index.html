<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("qcm-pays:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Quel pays te correspond ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --ink:#13233A; --muted:#5B6B7F; --line:#D5DDE5;
  color-scheme:light;
  --accent:#0F7F82; --accent-soft:#D6EEEE; --want:#D39A00; --bad:#B8403A; --good:#1E8A52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --surface:#172233; --ink:#E6ECF2; --muted:#93A3B6; --line:#2A3A50;
    color-scheme:dark;
    --accent:#3CC2C4; --accent-soft:#163A44; --want:#F0B82C; --bad:#E0716A; --good:#5BC98C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#172233; --ink:#E6ECF2; --muted:#93A3B6; --line:#2A3A50;
  color-scheme:dark;
    --accent:#3CC2C4; --accent-soft:#163A44; --want:#F0B82C; --bad:#E0716A; --good:#5BC98C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1,h2,.display{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif}
h1{font-size:2rem;line-height:1.1;font-weight:800;margin:8px 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
/* Quiz */
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtheme{color:var(--accent);font-weight:600;font-size:.9rem;margin:0}
.qtext{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;line-height:1.25;font-weight:700;margin:4px 0 16px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:13px 15px;margin-bottom:10px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.nav{display:flex;justify-content:space-between;margin-top:8px}
.link{background:none;border:0;color:var(--muted);padding:8px 0;text-decoration:underline}
/* Results */
.who{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.who h2{margin:0;font-size:1.5rem}
.badge{font-size:.8rem;color:var(--want);border:1px solid var(--want);border-radius:999px;padding:2px 10px;white-space:nowrap}
.ranking{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:10px 0 4px}
.rank{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:left;min-width:108px}
.rank b{display:block;font-size:.95rem}
.rank span{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent)}
.rank[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hex{display:block;width:100%;height:auto;max-width:420px;margin:0 auto}
.legend{display:flex;gap:16px;justify-content:center;font-size:.85rem;color:var(--muted);margin:4px 0 14px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.score{text-align:center;margin:0 0 6px}
.score .display{font-size:3rem;font-weight:800;line-height:1;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:420px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:1rem;margin:0 0 6px}
.cols ul{margin:0;padding-left:18px;font-size:.92rem}
.cols li{margin-bottom:4px}
.good h3{color:var(--good)} .weak h3{color:var(--bad)}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.cta{display:block;width:100%;margin-top:18px;border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:600}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.field input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:.88rem;margin:6px 0 0;min-height:1.2em}
.saved{margin-top:22px}
.saved h2{font-size:1.15rem;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.row .info{flex:1;min-width:0}
.row .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .info small{color:var(--muted)}
.btn{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;font-size:.88rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .cta{margin-top:0}
.cta.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
/* Responsive */
.wrap{max-width:1120px;padding:clamp(16px,3vw,40px) clamp(16px,4vw,48px) 48px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.top h1{flex:1;min-width:0;margin-top:0}
h1{font-size:clamp(1.8rem,4vw,2.8rem)}
.lead{max-width:62ch}
.panel{padding:clamp(18px,3vw,32px)}
.theme{flex:0 0 auto;display:inline-flex;margin-top:4px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.theme button{border:0;background:transparent;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quiz{max-width:860px;margin:0 auto}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts .opt{margin-bottom:0;height:100%}
.result{display:grid;gap:18px;grid-template-areas:"filters" "viz" "details"}
.filters{grid-area:filters;min-width:0}
.viz{grid-area:viz;min-width:0}
.details{grid-area:details;min-width:0}
.details .cols{margin-top:0}
@media (min-width:760px){
  .opts{grid-template-columns:repeat(3,1fr)}
  .qtext{font-size:1.75rem}
}
@media (min-width:860px){
  .home:has(.saved){display:grid;grid-template-columns:1fr 1fr;column-gap:48px;align-items:start}
  .home .saved{margin-top:0}
}
@media (min-width:960px){
  .result{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"viz filters" "viz details";column-gap:48px;align-items:start}
  .ranking{flex-wrap:wrap;overflow:visible}
  .viz{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .hex{max-width:540px}
  .score .display{font-size:3.6rem}
}
.analysis{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.analysis h3{font-size:1rem;margin:0 0 6px}
.analysis p{margin:0 0 10px;font-size:.95rem}
.analysis h4{font-size:.95rem;margin:16px 0 6px}
.analysis .warn{border-left:3px solid var(--bad);padding:6px 10px;background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:0 8px 8px 0}
.facts{margin:0;padding-left:18px;font-size:.92rem}
.facts li{margin-bottom:6px}
.axisrank,.full{list-style:none;margin:0;padding:0}
.axisrank li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.axisrank b{white-space:nowrap}
.more{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.more summary{cursor:pointer;font-weight:600}
.more ul{padding-left:18px;font-size:.9rem}
.more p{font-size:.9rem}
.full{max-height:340px;overflow-y:auto;margin-top:10px;counter-reset:r}
.full li{counter-increment:r}
.fullrow{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:transparent;padding:6px 4px;border-radius:8px;text-align:left}
.fullrow::before{content:counter(r);color:var(--muted);min-width:2.2em;font-size:.85rem}
.fullrow span{flex:1}
.fullrow[aria-pressed="true"]{background:var(--accent-soft)}
.qcount{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.bars{margin-top:18px}
.bars h3{font-size:1rem;margin:0 0 2px}
.fam h4{font-size:.9rem;margin:14px 0 6px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 1.6em;gap:10px;align-items:center;font-size:.88rem;margin-bottom:6px}
.bar.off{opacity:.5}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{position:relative;height:8px;background:var(--line);border-radius:4px}
.bt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bt em{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--want);border-radius:2px}
.bv{text-align:right;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Quel pays te correspond ?</h1>
    <div class="theme" role="group" aria-label="Thème">
      <button data-theme-set="auto" aria-label="Thème automatique" title="Automatique"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button><button data-theme-set="light" aria-label="Thème clair" title="Clair"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-theme-set="dark" aria-label="Thème sombre" title="Sombre"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </header>
  <p class="lead">Quarante questions sur ce qui compte vraiment pour toi, comparées à 183 pays. Ton résultat reste enregistré sur ton appareil, tu peux le revoir quand tu veux.</p>
  <section id="app"></section>
</main>

<script>
/* ====== CONFIG : axes, questions, pays (modifiable) ====== */
const AXES = [
  {id:'lib', label:'Liberté individuelle', short:'Liberté'},
  {id:'ent', label:'Liberté d’entreprendre', short:'Entreprendre'},
  {id:'suc', label:'Pas de droits de succession', short:'Succession'},
  {id:'sec', label:'Sécurité pour la famille', short:'Sécurité'},
  {id:'viv', label:'Art de vivre, kiffer', short:'Kiffer'},
  {id:'fis', label:'Impôts légers', short:'Impôts'},
  {id:'edu', label:'Éducation des enfants', short:'Éducation'},
  {id:'cul', label:'Mentalité pro-entrepreneur', short:'Mentalité'},
  {id:'gov', label:'Bonne gouvernance', short:'Gouvernance'},
  {id:'eta', label:'Place de l’État (10 = État léger)', short:'État', mode:'target'},
  {id:'dem', label:'Participation citoyenne', short:'Démocratie'},
  {id:'san', label:'Santé et accès aux soins', short:'Santé'},
  {id:'ali', label:'Qualité de l’alimentation', short:'Alimentation'},
  {id:'bie', label:'Bien-être et environnement', short:'Bien-être'},
  {id:'cou', label:'Coût de la vie abordable', short:'Coût'},
  {id:'pou', label:'Pouvoir d’achat local', short:'Pouvoir d’achat'}
];

// Familles affichées sur l'hexagone
const FAMILIES = [
  {label:'Libertés et démocratie', short:'Libertés', axes:['lib','dem','eta']},
  {label:'Entreprendre', short:'Entreprendre', axes:['ent','cul']},
  {label:'Fiscalité et patrimoine', short:'Fiscalité', axes:['fis','suc']},
  {label:'Sécurité et gouvernance', short:'Sécurité', axes:['sec','gov']},
  {label:'Coût de la vie', short:'Coût de la vie', axes:['cou','pou']},
  {label:'Qualité de vie', short:'Qualité de vie', axes:['viv','san','ali','bie','edu']}
];

// req = niveau exigé (0-10), w = poids (importance)
const QUESTIONS = [
  {axis:'lib', q:'Si un pays interdit ou encadre beaucoup de choses du quotidien (alcool, tabac, tenue, amendes pour des détails), tu réagis comment ?', opts:[
    {t:'Je refuse d’y vivre', s:'La liberté passe avant tout', req:10, w:3},
    {t:'Je m’adapte, mais ça me gêne', req:7, w:2},
    {t:'Ça ne me dérange pas', req:4, w:1}]},
  {axis:'ent', q:'Tu veux créer ton entreprise dans ce pays. Qu’est-ce que tu attends ?', opts:[
    {t:'Que ce soit simple et rapide', req:9, w:2},
    {t:'J’accepte quelques démarches', req:6, w:1},
    {t:'Je ne compte pas entreprendre', req:3, w:0.5}]},
  {axis:'suc', q:'Tes enfants hériteront de ton patrimoine. Les droits de succession, tu en penses quoi ?', opts:[
    {t:'Il ne doit y en avoir aucun', req:10, w:2},
    {t:'Un impôt modéré, ça va', req:6, w:1},
    {t:'Ça ne compte pas pour moi', req:0, w:0}]},
  {axis:'sec', q:'La sécurité pour ta femme et tes enfants, c’est quel niveau de priorité ?', opts:[
    {t:'Indispensable', s:'Rues sûres, bonnes écoles, bons hôpitaux', req:10, w:3},
    {t:'Important', req:7, w:2},
    {t:'Secondaire', req:4, w:1}]},
  {axis:'viv', q:'Profiter de la vie sur place (climat, cuisine, sorties), c’est quel niveau de priorité ?', opts:[
    {t:'La raison principale de partir', req:10, w:2.5},
    {t:'Très important', req:8, w:1.5},
    {t:'Un bonus', req:5, w:0.5}]},
  {axis:'fis', q:'Combien d’impôts sur tes revenus es-tu prêt à payer ?', opts:[
    {t:'Le moins possible', req:10, w:2},
    {t:'Un niveau raisonnable', req:6, w:1},
    {t:'Beaucoup, si les services publics suivent', req:3, w:0.5}]},
  {axis:'lib', q:'Pouvoir dire ce que tu penses, y compris critiquer le gouvernement, sans risquer d’ennuis, c’est…', opts:[
    {t:'Indispensable', req:10, w:3},
    {t:'Souhaitable, mais je peux me taire', req:6, w:1.5},
    {t:'Pas important, je ne parle pas de politique', req:3, w:0.5}]},
  {axis:'ent', q:'Obtenir un visa ou un titre de séjour pour travailler à ton compte, tu veux que ce soit…', opts:[
    {t:'Facile, avec un statut clair pour les entrepreneurs', req:9, w:2},
    {t:'Faisable, même si c’est long', req:6, w:1},
    {t:'Pas concerné, je serai salarié ou rentier', req:3, w:0.5}]},
  {axis:'suc', q:'Si tu avais le choix, tu transmettrais ton patrimoine…', opts:[
    {t:'Intégralement, sans que l’État en prenne une part', req:10, w:2},
    {t:'En laissant une petite part à l’État', req:6, w:1},
    {t:'Je préfère tout profiter de mon vivant', req:0, w:0}]},
  {axis:'sec', q:'Tes enfants doivent-ils pouvoir rentrer seuls de l’école à pied ?', opts:[
    {t:'Oui, sans aucune crainte', req:10, w:3},
    {t:'Oui, avec quelques précautions', req:7, w:2},
    {t:'Non, je les accompagnerai de toute façon', req:4, w:1}]},
  {axis:'viv', q:'Sortir, bien manger, avoir une vie sociale animée, tu en as besoin…', opts:[
    {t:'Tous les jours', req:10, w:2},
    {t:'Surtout le week-end', req:7, w:1},
    {t:'Rarement, je suis plutôt casanier', req:4, w:0.5}]},
  {axis:'fis', q:'Sur tes revenus d’entreprise ou de placements, tu veux…', opts:[
    {t:'Une fiscalité très basse, voire nulle', req:10, w:2},
    {t:'Un taux raisonnable', req:6, w:1},
    {t:'Peu importe', req:3, w:0.3}]},
  {axis:'edu', q:'L’école pour tes enfants, tu attends…', opts:[
    {t:'Un excellent niveau, parmi les meilleurs au monde', req:10, w:3},
    {t:'Un bon niveau, quitte à payer une école internationale', req:7, w:1.5},
    {t:'Pas concerné', req:0, w:0}]},
  {axis:'edu', q:'Les études supérieures sur place (universités, formations), c’est…', opts:[
    {t:'Important pour l’avenir de mes enfants', req:9, w:2},
    {t:'Un plus', req:6, w:1},
    {t:'Sans importance', req:3, w:0.3}]},
  {axis:'cul', q:'Autour de toi, tu veux que les gens voient l’entrepreneur comment ?', opts:[
    {t:'Comme quelqu’un qu’on admire et qu’on soutient', req:10, w:2},
    {t:'Normalement, sans plus', req:6, w:1},
    {t:'Peu m’importe', req:0, w:0}]},
  {axis:'cul', q:'Si ton projet échoue, tu veux que les gens…', opts:[
    {t:'Y voient une expérience, et que tu puisses rebondir', req:10, w:2},
    {t:'Ne te jugent pas trop', req:6, w:1},
    {t:'Je ne me pose pas la question', req:3, w:0.3}]},
  {axis:'lib', q:'Ton mode de vie (alcool, cannabis, tenue, vie de couple), tu veux que l’État…', opts:[
    {t:'Me laisse vivre comme je l’entends', req:10, w:2.5},
    {t:'Encadre un peu, c’est normal', req:6, w:1},
    {t:'Encadre strictement, ça me rassure', req:3, w:0.5}]},
  {axis:'sec', q:'Un pays stable, sans guerre, coup d’État ni émeutes, c’est…', opts:[
    {t:'Non négociable', req:10, w:3},
    {t:'Important', req:7, w:2},
    {t:'Je peux prendre le risque', req:4, w:1}]},
  {axis:'fis', q:'Les impôts sur ton patrimoine (fortune, plus-values, immobilier), tu les veux…', opts:[
    {t:'Les plus bas possible', req:10, w:2},
    {t:'Raisonnables', req:6, w:1},
    {t:'Peu importe', req:3, w:0.3}]},
  {axis:'cul', q:'Être entouré d’autres entrepreneurs, de réseaux, d’événements, pour toi c’est…', opts:[
    {t:'Essentiel pour avancer', req:10, w:2},
    {t:'Un plus', req:7, w:1},
    {t:'Pas besoin', req:3, w:0.3}]},
  {axis:'gov', q:'La corruption (pots-de-vin, passe-droits, favoritisme), tu la tolères…', opts:[
    {t:'Pas du tout, je veux des institutions intègres', req:10, w:3},
    {t:'Un peu, si le quotidien fonctionne', req:6, w:1.5},
    {t:'Je saurai m’adapter', req:3, w:0.5}]},
  {axis:'gov', q:'En cas de litige (contrat, voisin, administration), tu veux une justice…', opts:[
    {t:'Indépendante, rapide et prévisible', req:10, w:2.5},
    {t:'Correcte, même si elle est lente', req:6, w:1},
    {t:'Je n’y pense pas', req:3, w:0.3}]},
  {axis:'eta', q:'Idéalement, l’État…', opts:[
    {t:'S’occupe du minimum (sécurité, justice) et me laisse gérer le reste', req:10, w:2},
    {t:'Trouve un équilibre entre liberté et protection', req:5, w:1.5},
    {t:'Protège et redistribue largement (santé, retraites, aides)', req:1, w:2}]},
  {axis:'eta', q:'Face à une crise (pandémie, chômage, catastrophe), tu attends de l’État…', opts:[
    {t:'Qu’il intervienne le moins possible', req:10, w:1.5},
    {t:'Qu’il aide ponctuellement', req:5, w:1},
    {t:'Qu’il prenne largement les choses en charge', req:1, w:1.5}]},
  {axis:'dem', q:'Pouvoir voter directement sur les lois importantes (référendums, initiatives citoyennes), c’est…', opts:[
    {t:'Essentiel', s:'Comme en Suisse', req:10, w:2.5},
    {t:'Intéressant', req:6, w:1},
    {t:'Pas nécessaire, les élus sont là pour ça', req:2, w:0.3}]},
  {axis:'dem', q:'Des élections libres, avec une vraie possibilité d’alternance au pouvoir, c’est…', opts:[

/* ====== Calcul ====== */
function needs(answers){
  return AXES.map(a=>{
    let sr=0, sw=0, n=0;
    QUESTIONS.forEach((q,i)=>{ if(q.axis!==a.id) return; const x=answers[i]; if(x==null) return;
      const o=q.opts[x]; n++; sw+=o.w; sr+=o.req*o.w; });
    if(!n) return null;
    return { req: sw ? Math.round(sr/sw*10)/10 : 0, w: sw/n };
  });
}
const num = v => String(v).replace('.', ',');
const isT = i => AXES[i].mode==='target';
const fit = (i,v,req) => isT(i) ? -Math.abs(req-v) : v;
const missBy = (i,v,req) => isT(i) ? Math.abs(req-v) : req-v;
function score(c, nd){
  let pen=0, den=0;
  nd.forEach((o,i)=>{ if(!o||!o.w) return;
    if(AXES[i].mode==='target'){ den += o.w*Math.max(o.req,10-o.req); pen += o.w*Math.abs(o.req-c.v[i]); }
    else { den += o.w*o.req; pen += o.w*Math.max(0,o.req-c.v[i]); } });
  return den ? Math.round(100 - pen/den*100) : 0;
}
function ranked(answers, reg){
  const nd = needs(answers);
  return COUNTRIES.filter(c=>reg==='Tous'||c.r===reg).map(c=>({...c, s:score(c,nd)})).sort((a,b)=>b.s-a.s);
}

/* ====== Hexagone ====== */
function pt(i, val, R=110, cx=170, cy=160){ const ang=-Math.PI/2+i*Math.PI*2/FAMILIES.length, r=R*val/10; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; }
function poly(vals){ return vals.map((v,i)=>pt(i,v).join(',')).join(' '); }
const axIdx = id => AXES.findIndex(a=>a.id===id);
function famVals(c, nd){
  return FAMILIES.map(f=>{
    let sw=0, cv=0, rq=0, raw=0;
    f.axes.forEach(id=>{ const i=axIdx(id); raw+=c.v[i]; const o=nd[i]; if(!o||!o.w) return;
      sw+=o.w; cv+=o.w*(isT(i)?10-Math.abs(o.req-c.v[i]):c.v[i]); rq+=o.w*(isT(i)?10:o.req); });
    return sw ? {v:cv/sw, req:rq/sw, known:true} : {v:raw/f.axes.length, req:0, known:false};
  });
}
function hexSVG(c, nd){
  const fv = famVals(c, nd), L = FAMILIES.length;
  let g='';
  [2.5,5,7.5,10].forEach(l=> g+=`<polygon points="${poly(Array(L).fill(l))}" fill="none" stroke="var(--line)"/>`);
  FAMILIES.forEach((f,i)=>{ const [x,y]=pt(i,10); g+=`<line x1="170" y1="160" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  g+=`<polygon points="${poly(fv.map(f=>f.req))}" fill="none" stroke="var(--want)" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  g+=`<polygon points="${poly(fv.map(f=>f.v))}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5"/>`;
  fv.forEach((f,i)=>{ const [x,y]=pt(i,f.v); g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${f.known&&f.v<f.req-0.5?'var(--bad)':'var(--accent)'}"/>`; });
  FAMILIES.forEach((f,i)=>{ const [x,y]=pt(i,10,138); const an=Math.abs(x-170)<5?'middle':(x>170?'start':'end');
    g+=`<text x="${x}" y="${y+4}" text-anchor="${an}" font-size="15" font-weight="600" fill="${fv[i].known?'var(--ink)':'var(--muted)'}">${f.short}${fv[i].known?'':' (?)'}</text>`;
    g+=`<text x="${x}" y="${y+21}" text-anchor="${an}" font-size="13" fill="var(--muted)">${num(Math.round(fv[i].v*10)/10)}/10</text>`; });
  return `<svg class="hex" viewBox="-95 0 530 335" role="img" aria-label="Hexagone de correspondance ${esc(c.n)}">${g}</svg>`;
}
function barsHTML(c, nd){
  return FAMILIES.map(f=>`<div class="fam"><h4>${f.label}</h4>${f.axes.map(id=>{
    const i=axIdx(id), o=nd[i], v=c.v[i], on=o&&o.w;
    const ok = !on || (isT(i) ? Math.abs(o.req-v)<=2 : v>=o.req);
    return `<div class="bar${on?'':' off'}"><span class="bl">${AXES[i].label}</span><span class="bt"><i style="width:${v*10}%;background:${ok?'var(--accent)':'var(--bad)'}"></i>${on?`<em style="left:${o.req*10}%"></em>`:''}</span><span class="bv">${v}</span></div>`;
  }).join('')}</div>`).join('');
}

"suc", "Pas de droits de succession."], ["fis", "Statut non-domicilié : pas d’impôt sur les dividendes et intérêts pendant 17 ans."]], "Malte": [["fis", "Statut non-domicilié : les revenus étrangers non rapatriés ne sont pas imposés."], ["viv", "Climat méditerranéen, mais île très dense."]], "Irlande": [["suc", "Droits de 33 % au-delà d’un abattement."], ["fis", "Taux marginal de 40 %, plus des prélèvements sociaux."], ["cul", "Siège européen de nombreuses entreprises technologiques."]], "Luxembourg": [["suc", "Exonération en ligne directe."], ["fis", "Taux marginal élevé."], ["sec", "Très sûr."]], "Maurice": [["fis", "Taux maximal de 20 %."], ["suc", "Pas de droits de succession."], ["gen", "Francophone, visas de résidence accessibles."]], "Qatar": [["fis", "Pas d’impôt sur le revenu."], ["lib", "Liberté d’expression et libertés personnelles restreintes."]], "Israël": [["cul", "Surnommé la « nation startup »."], ["sec", "Conflit armé en cours."]], "Chili": [["suc", "Droits de succession jusqu’à 25 %."], ["cul", "Pôle startup d’Amérique latine (programme Start-Up Chile)."]], "Mexique": [["sec", "Violence liée aux cartels, très variable selon les régions."], ["suc", "Pas de droits de succession."], ["viv", "Climat, cuisine et culture très riches."], ["gov", "Corruption et impunité élevées."]], "Bulgarie": [["fis", "Impôt sur le revenu à taux unique de 10 %."], ["suc", "Enfants exonérés de droits de succession."]], "Roumanie": [["fis", "Impôt sur le revenu à taux unique de 10 %."]], "Hongrie": [["fis", "Impôt sur le revenu à taux unique de 15 %."], ["lib", "Recul de certaines libertés publiques ces dernières années."]], "France": [["suc", "Jusqu’à 45 % en ligne directe, après un abattement de 100 000 € par enfant."], ["fis", "Taux marginal de 45 %, plus les prélèvements sociaux."], ["viv", "Art de vivre reconnu."], ["eta", "Dépense publique parmi les plus élevées au monde, autour de 57 % du PIB."]], "Belgique": [["suc", "Droits de succession élevés, même en ligne directe."], ["fis", "L’une des pressions fiscales les plus fortes d’Europe."]], "Danemark": [["gov", "Régulièrement en tête des classements anticorruption."], ["eta", "État-providence très développé, financé par des impôts élevés."]]};

/* ====== Analyse ====== */
const ord = n => n===1 ? '1er' : n+'e';
const listFr = arr => arr.length<2 ? arr.join('') : arr.slice(0,-1).join(', ')+' et '+arr[arr.length-1];
function analysisHTML(c, answers, nd, weak, name){
  const all = ranked(answers, 'Tous'), N = all.length;
  const pos = all.findIndex(x=>x.n===c.n)+1;
  const lc = i => AXES[i].label.toLowerCase();
  const prio = AXES.map((a,i)=>({i, w:nd[i]?nd[i].w:0})).filter(x=>x.w>0).sort((x,y)=>y.w-x.w).slice(0,3).map(x=>lc(x.i));
  let h = `<p>${c.n} arrive ${ord(pos)} sur ${N} pays pour ${name}.${prio.length?` Tes critères les plus importants : ${listFr(prio)}.`:''}</p>`;

  const block = weak.filter(w=>nd[w.i].w>=2 && missBy(w.i, c.v[w.i], nd[w.i].req) >= 4);
  if(block.length) h += `<p class="warn">Point bloquant : ${listFr(block.map(b=>lc(b.i)+' ('+c.v[b.i]+'/10)'))}. Même bien classé, ce pays heurte un critère auquel tu tiens beaucoup.</p>`;

  const other = pos===1 ? all[1] : all[0];
  if(other){
    const gains=[], losses=[];
    AXES.forEach((a,i)=>{ if(!nd[i]||!nd[i].w) return; const d=fit(i,c.v[i],nd[i].req)-fit(i,other.v[i],nd[i].req); if(d>=2) gains.push(lc(i)); else if(d<=-2) losses.push(lc(i)); });
    const gap = Math.abs(c.s-other.s);
    h += `<p>Face à ${other.n} (${other.s} %), ${c.n} ${gains.length?`fait nettement mieux en ${listFr(gains)}`:'ne fait nettement mieux sur aucun de tes critères'}${losses.length?`, mais moins bien en ${listFr(losses)}`:''}.${gap<=2?' L’écart est trop faible pour les départager sur les seules notes : la fiche ci-dessous fait la différence.':''}</p>`;
  }
  if(weak.length){
    const wi = weak[0].i;
    const rq = nd[wi].req, alt = all.filter(x=>x.n!==c.n && x.s>=c.s-8 && fit(wi,x.v[wi],rq)>fit(wi,c.v[wi],rq)).sort((a,b)=>fit(wi,b.v[wi],rq)-fit(wi,a.v[wi],rq)||b.s-a.s)[0];
    if(alt) h += `<p>Son point le plus faible pour toi est ${lc(wi)} (${c.v[wi]}/10). Si ce critère pèse lourd, ${alt.n} fait mieux (${alt.v[wi]}/10) pour un score proche (${alt.s} %).</p>`;
  }

  const notes = (NOTES[c.n]||[]).map(([ax,t])=>{
    const i = AXES.findIndex(a=>a.id===ax);
    const isWeak = weak.some(w=>w.i===i);
    const w = i<0 ? -1 : (nd[i]?nd[i].w:0);
    return {t, label: i<0 ? 'À savoir' : AXES[i].label, k: isWeak ? 100+w : w};
  }).sort((a,b)=>b.k-a.k);
  h += `<h4>Ce qu’il faut savoir sur ${c.n}</h4>` + (notes.length
    ? `<ul class="facts">${notes.map(n=>`<li><b>${n.label}</b> : ${n.t}</li>`).join('')}</ul>`
    : `<p class="note">Pas de fiche détaillée pour ce pays : le diagnostic repose uniquement sur les notes.</p>`);

  const ranks = AXES.map((a,i)=>{ if(!nd[i]||!nd[i].w) return '';
    const r = 1 + COUNTRIES.filter(x=>fit(i,x.v[i],nd[i].req)>fit(i,c.v[i],nd[i].req)).length;
    return `<li><span>${a.label}</span><b>${ord(r)} sur ${N}</b></li>`; }).join('');
  return `<div class="analysis"><h3>Diagnostic</h3>${h}${ranks?`<h4>Rang sur chaque critère</h4><ul class="axisrank">${ranks}</ul>`:''}</div>`;
}
const METHOD = `<p>Le diagnostic combine trois éléments : tes réponses, qui fixent un niveau exigé et une importance par critère ; une note de 0 à 10 par pays et par critère ; et, pour une quarantaine de pays, une fiche de faits marquants. Chaque note de 0 à 10 est une estimation établie par Claude à partir d’indices publics, tels qu’ils étaient connus mi-2026. Ce ne sont pas les chiffres officiels : ils peuvent être approximatifs ou en retard sur l’actualité, à vérifier avant toute décision.</p>
<ul>
<li><b>Liberté individuelle</b> : Human Freedom Index (volet liberté personnelle, Cato et Fraser Institute) et Freedom House.</li>
<li><b>Liberté d’entreprendre</b> : Economic Freedom of the World (Fraser Institute) et Index of Economic Freedom (Heritage Foundation).</li>
<li><b>Succession</b> : existence et taux des droits de succession en ligne directe (guide mondial d’EY). 10 = aucun droit pour les enfants.</li>
<li><b>Sécurité</b> : Global Peace Index, taux d’homicides de l’ONUDC et conflits en cours.</li>
<li><b>Art de vivre</b> : World Happiness Report, complété par le climat, la gastronomie et la vie sociale. C’est l’axe le plus subjectif.</li>
<li><b>Impôts</b> : taux marginal maximal de l’impôt sur le revenu (tableaux KPMG et PwC). 0 % = 10, 55 % = 1, avec un bonus pour les fiscalités territoriales.</li>
<li><b>Éducation des enfants</b> : résultats PISA (OCDE), classements universitaires et offre d’écoles internationales.</li>
<li><b>Bonne gouvernance</b> : indice de perception de la corruption (Transparency International), indice de l’État de droit du World Justice Project, efficacité gouvernementale (Banque mondiale).</li>
<li><b>Place de l’État</b> : poids de la dépense publique dans le PIB (FMI) et degré de contrôle de l’État sur l’économie. 10 = État léger, 0 = État omniprésent. Sur ce critère, le score ne récompense pas « le plus » : il mesure la distance avec le modèle que tu préfères, qu’il soit léger, équilibré ou protecteur.</li>
<li><b>Participation citoyenne</b> : Democracy Index (EIU) et V-Dem, avec un bonus pour la démocratie directe (référendums et initiatives populaires : Suisse, Liechtenstein, Uruguay, Italie, Taïwan, États américains).</li>
<li><b>Santé</b> : qualité et accès aux soins, délais d’attente, espérance de vie (OMS).</li>
<li><b>Alimentation</b> : qualité et fraîcheur des produits, tradition culinaire, sécurité sanitaire des aliments.</li>
<li><b>Bien-être</b> : équilibre vie pro-perso (OCDE, Better Life Index), qualité de l’air (OMS), accès à la nature, rythme de vie.</li>
<li><b>Coût de la vie</b> : niveau des prix des loyers, des courses et des factures par rapport à la France (Numbeo, parités de pouvoir d’achat de la Banque mondiale). 10 = très bon marché.</li>
<li><b>Pouvoir d’achat local</b> : salaire local moyen rapporté au loyer et au panier de courses. 10 = salaires confortables par rapport au coût de la vie.</li>
<li><b>Mentalité pro-entrepreneur</b> : Global Entrepreneurship Monitor (image de l’entrepreneur dans la société, peur de l’échec, envie de créer).</li>
</ul><p>Pour une soixantaine de pays moins courants, les six derniers critères (démocratie, santé, alimentation, bien-être, coût de la vie, pouvoir d’achat) sont extrapolés à partir des autres notes ; la page le signale. L’hexagone regroupe les critères en six familles, chacune notée comme la moyenne de ses critères pondérée par ton importance.</p><p>Les notes sont pensées pour un résident de nationalité française : par exemple, Monaco n’exonère pas d’impôt sur le revenu les Français, qui y restent imposés en France.</p>`;

/* ====== Ordre du quiz : par famille ====== */
const famOf = q => FAMILIES.findIndex(f=>f.axes.includes(q.axis));
const ORDER = QUESTIONS.map((q,i)=>i).sort((a,b)=> famOf(QUESTIONS[a])-famOf(QUESTIONS[b]) || axIdx(QUESTIONS[a].axis)-axIdx(QUESTIONS[b].axis) || a-b);

/* ====== Écrans ====== */
function renderHome(){
  const names = Object.keys(store.profiles).sort((a,b)=>store.profiles[b].date.localeCompare(store.profiles[a].date));
  app.innerHTML = `
  <div class="panel home"><div class="start">
    <div class="field">
      <label for="name">Ton prénom</label>
      <input id="name" autocomplete="given-name" maxlength="40" value="${esc(draftName)}" placeholder="Par exemple Charlie">
      <p class="err" id="err" aria-live="polite"></p>
    </div>
    <button class="cta" data-act="start" style="margin-top:6px">Commencer le QCM</button>
    </div>
    ${names.length ? `<div class="saved"><h2>Profils enregistrés sur cet appareil</h2>
      ${names.map((n,i)=>{ const p=store.profiles[n], top=ranked(p.answers,'Tous')[0];
        return `<div class="row"><div class="info"><b>${esc(n)}</b><small>${top?esc(top.n)+' à '+top.s+'%':''}, le ${fmtDate(p.date)}</small></div>
        <button class="btn primary" data-see="${i}">Voir</button><button class="btn danger" data-del="${i}" aria-label="Supprimer le profil ${esc(n)}">Supprimer</button></div>`; }).join('')}
    </div>` : ''}
  </div>`;
  app._names = names;
  const input = document.getElementById('name');
  input.addEventListener('input', e=>{ draftName = e.target.value; });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') startQuiz(); });
}

function startQuiz(){
  const n = draftName.trim();
  if(!n){ const e=document.getElementById('err'); if(e) e.textContent='Entre ton prénom pour commencer.'; return; }
  current = n; draft = QUESTIONS.map(()=>undefined); qi = 0; view = 'quiz'; render();
}

function renderQuiz(){
  if(qi >= QUESTIONS.length){
    store.profiles[current] = {answers: draft.map(a=>a===undefined?null:a), date: new Date().toISOString()};
    store.last = current; saveStore(); view='result'; selected=0; return render();
  }
  const k = ORDER[qi], Q = QUESTIONS[k], ax = AXES.find(a=>a.id===Q.axis), fam = FAMILIES[famOf(Q)];
  app.innerHTML = `
  <div class="panel quiz">
    <div class="progress"><i style="width:${qi/QUESTIONS.length*100}%"></i></div>
    <p class="qtheme">${fam.label}</p><p class="qcount">Question ${qi+1} sur ${QUESTIONS.length}, ${ax.label.toLowerCase()}</p>
    <p class="qtext">${Q.q}</p>
    <div class="opts">${Q.opts.map((o,i)=>`<button class="opt" data-o="${i}" aria-pressed="${draft[k]===i}">${o.t}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')}</div>
    <div class="nav">
      <button class="link" data-nav="back">${qi===0?'Annuler':'Question précédente'}</button>
      <button class="link" data-nav="skip">Passer</button>
    </div>
  </div>`;
}

function renderResult(){
  const p = store.profiles[current];
  if(!p){ view='home'; return render(); }
  const answers = QUESTIONS.map((_,i)=>p.answers[i]==null?null:p.answers[i]), partial = answers.some(a=>a==null);
  const list = ranked(answers, region), nd = needs(answers);
  if(selected >= list.length) selected = 0;
  const c = list[selected], good=[], weak=[], unknown=[];
  AXES.forEach((a,i)=>{
    const o = nd[i];
    if(!o){ unknown.push(a.label); return; }
    if(!o.w) return;
    const gap = missBy(i, c.v[i], o.req);
    if(isT(i) ? gap<=2 : gap<=0) good.push(`${a.label} <small>(${c.v[i]}/10)</small>`);
    else weak.push({t:`${a.label} <small>(${c.v[i]}/10, ${isT(i)?'souhaité autour de':'attendu'} ${num(o.req)})</small>`, k:gap*o.w, i});
  });
  weak.sort((x,y)=>y.k-x.k);
  const regions = ['Tous', ...new Set(COUNTRIES.map(c=>c.r))];
  const name = esc(current);
  app.innerHTML = `
  <div class="panel">
    <div class="who"><h2>${name}</h2>${partial?'<span class="badge">Réponses partielles</span>':''}</div>
    <div class="result"><div class="filters"><div class="tabs" role="group" aria-label="Région" style="margin:10px 0 0">
      ${regions.map(r=>`<button class="chip" data-region="${r}" aria-pressed="${r===region}">${r}</button>`).join('')}
    </div>
    <div class="ranking">
      ${list.slice(0,6).map((x,i)=>`<button class="rank" data-i="${i}" aria-pressed="${i===selected}"><b>${x.n}</b><span>${x.s}%</span></button>`).join('')}
    </div></div>
    <div class="viz"><p class="score"><span class="display">${c.s}%</span><br><span style="color:var(--muted)">${c.n}</span></p>
    ${hexSVG(c, nd)}
    <div class="legend"><span><i style="background:var(--accent)"></i>${c.n}</span><span><i style="background:var(--want)"></i>Exigences de ${name}</span></div>
    <div class="bars"><h3>Détail des ${AXES.length} critères</h3><p class="note">Barre = note du pays, trait = ton niveau exigé. En rouge : exigence non atteinte.</p>${barsHTML(c, nd)}${EXTRAPOLATED.has(c.n)?'<p class="note">Pour ce pays, la démocratie, la santé, l’alimentation, le bien-être et le coût de la vie sont extrapolés à partir des autres notes.</p>':''}</div></div>
    <div class="details"><div class="cols">
      <div class="good"><h3>Forces</h3>${good.length?`<ul>${good.map(g=>`<li>${g}</li>`).join('')}</ul>`:'<p class="note">Aucune exigence pleinement remplie.</p>'}</div>
      <div class="weak"><h3>Faiblesses</h3>${weak.length?`<ul>${weak.map(w=>`<li>${w.t}</li>`).join('')}</ul>`:'<p class="note">Rien ne coince.</p>'}</div>
    </div>
    ${unknown.length?`<p class="note">Pas encore renseigné : ${unknown.join(', ')}. Ces critères ne comptent pas dans le score.</p>`:''}
    ${analysisHTML(c, answers, nd, weak, name)}
    <details class="more"><summary>Classement complet (${list.length} pays)</summary>
      <ol class="full">${list.map((x,i)=>`<li><button class="fullrow" data-i="${i}" aria-pressed="${i===selected}"><span>${x.n}</span><b>${x.s} %</b></button></li>`).join('')}</ol>
    </details>
    <details class="more"><summary>Sur quoi reposent les notes ?</summary>${METHOD}</details>
    <p class="note">Enregistré sur cet appareil le ${fmtDate(p.date)}. Le pourcentage mesure à quel point le pays atteint tes exigences, pondérées par leur importance.</p>
    <div class="actions">
      <button class="cta" data-act="redo">Refaire le QCM</button>
      <button class="cta secondary" data-act="home">Autre profil</button>
    </div>
  </div></div></div>`;
}

function render(){
  if(view==='home') renderHome();
  else if(view==='quiz') renderQuiz();
  else renderResult();
  window.scrollTo({top:0});
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.themeSet){ applyTheme(d.themeSet); return; }
  if(d.act==='start') startQuiz();
  else if(d.act==='redo'){ draftName = current; startQuiz(); }
  else if(d.act==='home'){ draftName=''; view='home'; render(); }
  else if(d.see!=null){ current = app._names[+d.see]; store.last=current; saveStore(); selected=0; region='Tous'; view='result'; render(); }
  else if(d.del!=null){ const n = app._names[+d.del];
    if(confirm(`Supprimer le profil de ${n} ?`)){ delete store.profiles[n]; if(store.last===n) store.last=null; saveStore(); render(); } }
  else if(d.o!=null){ draft[ORDER[qi]]=+d.o; qi++; render(); }
  else if(d.nav==='skip'){ draft[ORDER[qi]]=null; qi++; render(); }
  else if(d.nav==='back'){ if(qi===0){ view = store.profiles[current]?'result':'home'; } else qi--; render(); }
  else if(d.i!=null){ selected=+d.i; render(); }
  else if(d.region){ region=d.region; selected=0; render(); }
});
render();
</script>
</body>
</html>
